aid: newcleo
name: Newcleo
description: 'Newcleo is a nuclear energy company founded in September 2021 by Stefano
  Buono, Luciano Cinotti and Elisabeth Rizzotti, headquartered in Paris with operations
  across France, Italy, the United Kingdom, Switzerland, Belgium and Slovakia. It designs
  small modular lead-cooled fast reactors (LFR) fuelled with mixed oxide (MOX) fuel made
  from reprocessed spent nuclear fuel, with the aim of closing the nuclear fuel cycle and
  reducing long-lived waste. The group employs roughly 1,000 people, has raised over EUR
  780 million, and has grown by acquisition (Hydromine Nuclear Energy, SRS-Fucina, Rutschi
  Group). Newcleo publishes no public developer API or developer program; its only public
  machine-consumable software is a small set of open-source scientific Python libraries
  released through its newcleo-dev-team GitHub organisation.'
